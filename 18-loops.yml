- name: install packages
  hosts: local
  connection: local
  tasks:
    - name: install packages using loop
      ansible.builtin.package:
        name: "{{ item.name}}"
        state: "{{ item.state }}"
      loop:
        - {name: git, state: present}
        - {name: vim, state: absent}
        - {name: wget, state: present}