- name: demo on error handling
  hosts: local
  connection: local
  tasks:
    - name: check user exit or not 
      ansible.builtin.command: id roboshop
      register: user_check
      ignore_errors: true

    - name: print the  output
      ansible.builtin.debug:
        msg: "{{user_check}}"


    - name: create user
      ansible.builtin.command: useradd roboshop
      when: user_check.rc != 0
      


